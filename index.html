
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>學測計畫表</title>
    
    <!-- 引入 FullCalendar 核心與語言包 -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/locales-all.global.min.js"></script>

    <style>
        body {
            margin: 20px 10px;
            padding: 0;
            font-family: 'Helvetica Neue', Helvetica, Arial, '微軟正黑體', sans-serif;
            background-color: #f4f6f8;
            color: #333;
            /* 防止手機點擊時雙擊放大，提升觸控反應速度 */
            touch-action: manipulation; 
        }
        
        #app-container { max-width: 1200px; margin: 0 auto; }

        /* 動態倒數計時器樣式 */
        #countdown-container {
            background: white; text-align: center; padding: 20px;
            border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 15px; font-size: 22px; font-weight: bold; color: #2c3e50;
        }
        .cd-num {
            color: #e74c3c; font-size: 32px; margin: 0 4px;
            display: inline-block; min-width: 40px; text-align: center;
        }

        /* 跨機同步按鈕區 */
        #sync-container {
            text-align: right; margin-bottom: 15px;
        }
        .btn-sync {
            display: inline-block; padding: 8px 15px; margin-left: 10px; font-size: 14px;
            border: none; border-radius: 6px; cursor: pointer; color: white; text-decoration: none; font-weight: bold;
        }
        .btn-export { background-color: #8e44ad; } .btn-export:hover { background-color: #732d91; }
        .btn-import { background-color: #2980b9; } .btn-import:hover { background-color: #1c5980; }

        /* 日曆容器樣式 */
        #calendar-container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }

        .fc-button-primary { background-color: #2c3e50 !important; border-color: #2c3e50 !important; }
        .fc-button-primary:hover { background-color: #1a252f !important; }
        .fc-button-active { background-color: #18bc9c !important; border-color: #18bc9c !important; }

        /* 放假日 顯示為紅色 */
        .fc-day-sat, .fc-day-sun, .holiday-red { background-color: #fff5f5 !important; }
        .fc-col-header-cell.fc-day-sat a, .fc-col-header-cell.fc-day-sun a { color: #e74c3c !important; }
        .fc-day-sat .fc-daygrid-day-number, .fc-day-sun .fc-daygrid-day-number, .holiday-red .fc-daygrid-day-number { 
            color: #e74c3c !important; font-weight: bold; 
        }

        /* 組合式彈出視窗 (Modal) 樣式 */
        #modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); z-index: 9999; justify-content: center; align-items: center;
        }
        #custom-modal {
            background: white; padding: 25px; border-radius: 12px; width: 440px; max-width: 90%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        #custom-modal h3 { margin-top: 0; color: #2c3e50; text-align: center; }
        
        .combo-row { display: flex; align-items: center; gap: 6px; margin-bottom: 12px; }
        .combo-row input {
            /* font-size 必須為 16px，否則 iPhone 點擊輸入框會自動強迫畫面放大 */
            flex: 1; padding: 8px; font-size: 16px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; min-width: 0;
        }
        .mini-btn { padding: 8px; font-size: 14px; border: none; border-radius: 4px; cursor: pointer; color: white; }
        
        .btn-add { background-color: #3498db; } .btn-add:hover { background-color: #2980b9; }
        .btn-clear { background-color: #f39c12; } .btn-clear:hover { background-color: #e67e22; }
        .btn-del { background-color: #e74c3c; } .btn-del:hover { background-color: #c0392b; }
        
        #preview-box {
            text-align: center; margin: 15px 0; padding: 10px;
            background: #e8f8f5; color: #16a085; font-weight: bold; font-size: 18px; border-radius: 6px;
        }

        .btn-save { background-color: #18bc9c; font-size: 16px; padding: 12px; width: 100%; border:none; border-radius:6px; color:white; cursor:pointer; }
        .btn-save:hover { background-color: #128f76; }
        .btn-cancel { background-color: #95a5a6; font-size: 16px; padding: 12px; margin-top: 10px; width: 100%; border:none; border-radius:6px; color:white; cursor:pointer; }
        .btn-cancel:hover { background-color: #7f8c8d; }
    </style>
</head>
<body>

    <div id="app-container">
        <!-- 動態倒數計時區 -->
        <div id="countdown-container">
            🔥 距離 2027 學測 (1/22) 還有 <br>
            <span class="cd-num" id="cd-days">--</span> 天 
            <span class="cd-num" id="cd-hours">--</span> 時 
            <span class="cd-num" id="cd-mins">--</span> 分 
            <span class="cd-num" id="cd-secs">--</span> 秒
        </div>

        <!-- 匯出匯入功能區 -->
        <div id="sync-container">
            <button class="btn-sync btn-export" onclick="exportData()">📥 匯出 (備份)</button>
            <label class="btn-sync btn-import">
                <input type="file" accept=".json" style="display:none;" onchange="importData(event)">
                📤 匯入 (讀取)
            </label>
        </div>

        <div id="calendar-container">
            <div id="calendar"></div>
        </div>
    </div>

    <!-- 可選可填的智慧彈出視窗 -->
    <div id="modal-overlay">
        <div id="custom-modal">
            <h3>📝 新增計畫</h3>
            <p style="font-size: 13px; color: #7f8c8d; text-align: center; margin-top: -10px;">點擊欄位可下拉選擇，也可直接打字</p>
            
            <div class="combo-row">
                <span style="width: 40px; font-weight: bold;">類型</span>
                <input type="text" id="input-type" list="list-type" oninput="updatePreview()" placeholder="選/填 (例: 新/舊)">
                <datalist id="list-type"></datalist>
                <button class="mini-btn btn-add" onclick="manageOption('type', 'add')" title="將輸入文字存入選單">➕</button>
                <button class="mini-btn btn-clear" onclick="manageOption('type', 'clear')" title="清空此輸入框">🧹</button>
                <button class="mini-btn btn-del" onclick="manageOption('type', 'del')" title="從選單刪除該文字">🗑️</button>
            </div>
            
            <div class="combo-row">
                <span style="width: 40px; font-weight: bold;">科目</span>
                <input type="text" id="input-subject" list="list-subject" oninput="updatePreview()" placeholder="選/填 (例: 國/英聽)">
                <datalist id="list-subject"></datalist>
                <button class="mini-btn btn-add" onclick="manageOption('subject', 'add')" title="將輸入文字存入選單">➕</button>
                <button class="mini-btn btn-clear" onclick="manageOption('subject', 'clear')" title="清空此輸入框">🧹</button>
                <button class="mini-btn btn-del" onclick="manageOption('subject', 'del')" title="從選單刪除該文字">🗑️</button>
            </div>

            <div class="combo-row">
                <span style="width: 40px; font-weight: bold;">形式</span>
                <input type="text" id="input-format" list="list-format" oninput="updatePreview()" placeholder="選/填 (例: 模考/月考)">
                <datalist id="list-format"></datalist>
                <button class="mini-btn btn-add" onclick="manageOption('format', 'add')" title="將輸入文字存入選單">➕</button>
                <button class="mini-btn btn-clear" onclick="manageOption('format', 'clear')" title="清空此輸入框">🧹</button>
                <button class="mini-btn btn-del" onclick="manageOption('format', 'del')" title="從選單刪除該文字">🗑️</button>
            </div>

            <div class="combo-row">
                <span style="width: 40px; font-weight: bold;">範圍</span>
                <input type="text" id="input-range" list="list-range" oninput="updatePreview()" placeholder="選/填 (例: 1~4冊)">
                <datalist id="list-range"></datalist>
                <button class="mini-btn btn-add" onclick="manageOption('range', 'add')" title="將輸入文字存入選單">➕</button>
                <button class="mini-btn btn-clear" onclick="manageOption('range', 'clear')" title="清空此輸入框">🧹</button>
                <button class="mini-btn btn-del" onclick="manageOption('range', 'del')" title="從選單刪除該文字">🗑️</button>
            </div>
            
            <div id="preview-box">預覽: <span id="plan-preview"></span></div>
            
            <button class="btn-save" onclick="saveEvent()">✔️ 確認加入計畫</button>
            <button class="btn-cancel" onclick="closeModal()">❌ 取消</button>
        </div>
    </div>

    <script>
        // --- 匯出資料功能 (針對 iOS Safari 下載進行特化修改) ---
        function exportData() {
            var backupData = {
                events: localStorage.getItem('myCalendarEvents'),
                planType: localStorage.getItem('planType_v4'),
                planSubject: localStorage.getItem('planSubject_v4'),
                planFormat: localStorage.getItem('planFormat_v4'),
                planRange: localStorage.getItem('planRange_v4')
            };
            
            // 使用 Blob 物件，這是在 iPhone 上唯一穩定觸發下載的方式
            var jsonStr = JSON.stringify(backupData);
            var blob = new Blob([jsonStr], { type: "application/json" });
            var url = URL.createObjectURL(blob);

            var downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", url);
            downloadAnchorNode.setAttribute("download", "學測計畫表_備份.json");
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
            
            // 釋放記憶體
            setTimeout(function() { URL.revokeObjectURL(url); }, 100);
        }

        // --- 匯入資料功能 ---
        function importData(event) {
            var file = event.target.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function(e) {
                try {
                    var backupData = JSON.parse(e.target.result);
                    if (backupData.events) localStorage.setItem('myCalendarEvents', backupData.events);
                    if (backupData.planType) localStorage.setItem('planType_v4', backupData.planType);
                    if (backupData.planSubject) localStorage.setItem('planSubject_v4', backupData.planSubject);
                    if (backupData.planFormat) localStorage.setItem('planFormat_v4', backupData.planFormat);
                    if (backupData.planRange) localStorage.setItem('planRange_v4', backupData.planRange);
                    
                    alert("✅ 資料還原成功！網頁即將重新載入套用新資料。");
                    location.reload(); 
                } catch (err) {
                    alert("❌ 檔案格式錯誤！請選擇正確的 .json 備份檔。");
                }
            };
            reader.readAsText(file);
            event.target.value = ''; // 允許重複上傳同一檔案
        }

        // 1. 動態學測倒數計時
        function startCountdown() {
            var targetDate = new Date('2027-01-22T00:00:00').getTime();
            setInterval(function() {
                var now = new Date().getTime();
                var distance = targetDate - now;
                if (distance < 0) {
                    document.getElementById('countdown-container').innerHTML = "🔥 學測已經開始或結束囉！祝你金榜題名！ 🔥";
                    return;
                }
                document.getElementById('cd-days').innerText = Math.floor(distance / (1000 * 60 * 60 * 24));
                document.getElementById('cd-hours').innerText = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)).toString().padStart(2, '0');
                document.getElementById('cd-mins').innerText = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
                document.getElementById('cd-secs').innerText = Math.floor((distance % (1000 * 60)) / 1000).toString().padStart(2, '0');
            }, 1000);
        }
        startCountdown();

        // 2. 國定假日清單
        var holidays = [
            '2026-09-17', '2026-10-10', '2027-01-01', 
            '2027-02-05', '2027-02-06', '2027-02-07', '2027-02-08', '2027-02-09', '2027-02-10',
            '2027-02-28', '2027-03-01', '2027-04-04', '2027-04-05', '2027-06-09', '2027-09-15', '2027-10-10'
        ];

        // 3. 全新可選可填清單
        var comboData = {
            type: JSON.parse(localStorage.getItem('planType_v4')) || ['新', '舊'],
            subject: JSON.parse(localStorage.getItem('planSubject_v4')) || ['國', '國綜', '國寫', '英', '英聽', '英翻', '英作', '數', '自物', '自化', '自生', '自地'],
            format: JSON.parse(localStorage.getItem('planFormat_v4')) || ['複習', '模考', '月考', '平時考', '歷屆', '中叢', '筆記'],
            range: JSON.parse(localStorage.getItem('planRange_v4')) || ['第一冊', '第二冊', '第三冊', '第四冊', '第五冊', '全'] 
        };

        function renderDataLists() {
            ['type', 'subject', 'format', 'range'].forEach(function(category) {
                var datalist = document.getElementById('list-' + category);
                datalist.innerHTML = '';
                comboData[category].forEach(function(opt) {
                    var option = document.createElement('option');
                    option.value = opt;
                    datalist.appendChild(option);
                });
            });
            updatePreview();
        }

        // 動態更新下方的綠色預覽文字
        function updatePreview() {
            var t = document.getElementById('input-type').value.trim();
            var s = document.getElementById('input-subject').value.trim();
            var f = document.getElementById('input-format').value.trim();
            var r = document.getElementById('input-range').value.trim(); 
            
            var parts = [t, s, f, r].filter(function(val) { return val !== ''; });
            document.getElementById('plan-preview').innerText = parts.length > 0 ? parts.join('') : '（請輸入或選擇）';
        }

        // 管理清單選項
        function manageOption(category, action) {
            var inputEl = document.getElementById('input-' + category);
            
            if (action === 'clear') {
                inputEl.value = ''; updatePreview(); return;
            }

            var val = inputEl.value.trim();
            var catName = '';
            if(category === 'type') catName = '類型';
            else if(category === 'subject') catName = '科目';
            else if(category === 'format') catName = '形式';
            else if(category === 'range') catName = '範圍';
            
            if (!val) { alert('請先在左側輸入文字，才能進行新增或刪除喔！'); return; }
            
            if (action === 'add') {
                if (!comboData[category].includes(val)) {
                    comboData[category].push(val);
                    alert('已成功將「' + val + '」加入' + catName + '清單！');
                } else {
                    alert('「' + val + '」已經在清單裡囉！');
                }
            } else if (action === 'del') {
                if (comboData[category].includes(val)) {
                    if (confirm('確定要從清單中永久刪除「' + val + '」嗎？')) {
                        comboData[category] = comboData[category].filter(function(v) { return v !== val; });
                        inputEl.value = ''; 
                    }
                } else {
                    alert('預設清單裡沒有這個詞彙喔！');
                }
            }
            
            localStorage.setItem('plan' + category.charAt(0).toUpperCase() + category.slice(1) + '_v4', JSON.stringify(comboData[category]));
            renderDataLists(); updatePreview();
        }

        // 4. 彈出視窗與日曆互動
        var currentSelectInfo = null;
        var calendar;

        function openModal(info) {
            currentSelectInfo = info;
            document.getElementById('input-type').value = '';
            document.getElementById('input-subject').value = '';
            document.getElementById('input-format').value = '';
            document.getElementById('input-range').value = '';
            renderDataLists();
            document.getElementById('modal-overlay').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal-overlay').style.display = 'none';
            if (calendar) calendar.unselect();
            currentSelectInfo = null;
        }

        function saveEvent() {
            var finalTitle = document.getElementById('plan-preview').innerText;
            if (finalTitle && finalTitle !== '（請輸入或選擇）' && currentSelectInfo) {
                calendar.addEvent({
                    id: String(Date.now()), title: finalTitle,
                    start: currentSelectInfo.startStr, end: currentSelectInfo.endStr, allDay: currentSelectInfo.allDay,
                    backgroundColor: '#18bc9c', borderColor: '#18bc9c'
                });
                saveEventsToLocalStorage();
                closeModal();
            } else {
                alert('計畫內容不能為空喔！');
            }
        }

        function saveEventsToLocalStorage() {
            var currentEvents = calendar.getEvents().map(function(e) {
                return { id: e.id, title: e.title, start: e.startStr, end: e.endStr, allDay: e.allDay };
            });
            localStorage.setItem('myCalendarEvents', JSON.stringify(currentEvents));
        }

        // 5. 日曆初始化
        document.addEventListener('DOMContentLoaded', function() {
            var calendarEl = document.getElementById('calendar');
            var savedEvents = JSON.parse(localStorage.getItem('myCalendarEvents')) || [];

            calendar = new FullCalendar.Calendar(calendarEl, {
                locale: 'zh-tw',
                views: { examYear: { type: 'multiMonth', duration: { months: 5 }, buttonText: '年' } },
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'examYear,dayGridMonth,timeGridWeek,timeGridDay'
                },
                buttonText: { month: '月', week: '周', day: '日', today: '今天' },
                initialView: 'dayGridMonth',
                
                initialDate: '2026-09-01',
                validRange: { start: '2026-09-01' },

                // ▼▼▼ 非常重要：這行設定解決了 iPhone 點擊無反應的問題 ▼▼▼
                selectLongPressDelay: 100, // 將長按判定從預設的 1000 毫秒縮短為 100 毫秒 (點一下即觸發)
                // ▲▲▲ ▲▲▲ ▲▲▲ ▲▲▲ ▲▲▲

                dayCellClassNames: function(arg) {
                    var dateStr = arg.date.getFullYear() + '-' + 
                                  String(arg.date.getMonth() + 1).padStart(2, '0') + '-' + 
                                  String(arg.date.getDate()).padStart(2, '0');
                    if (holidays.includes(dateStr)) return ['holiday-red'];
                    return [];
                },

                selectable: true,
                selectMirror: true,
                editable: true,
                events: savedEvents,

                select: function(info) { openModal(info); },
                eventClick: function(info) {
                    if (confirm('確定要刪除計畫：「' + info.event.title + '」嗎？')) {
                        info.event.remove();
                        saveEventsToLocalStorage();
                    }
                },
                eventDrop: function() { saveEventsToLocalStorage(); },
                eventResize: function() { saveEventsToLocalStorage(); }
            });

            calendar.render();
        });
    </script>
</body>
</html>
