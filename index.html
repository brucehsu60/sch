<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學測計畫表</title>
    
    <!-- 引入 FullCalendar 核心與語言包 -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/locales-all.global.min.js"></script>

    <style>
        body {
            margin: 20px 10px;
            padding: 0;
            font-family: 'Helvetica Neue', Helvetica, Arial, '微軟正黑體', sans-serif;
            background-color: #f4f6f8;
            color: #333;
        }
        
        #app-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 倒數計時器樣式 */
        #countdown-container {
            background: white;
            text-align: center;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
        }
        #countdown-days {
            color: #e74c3c;
            font-size: 40px;
            margin: 0 5px;
        }

        /* 日曆容器樣式 */
        #calendar-container {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        /* 自訂按鈕顏色 */
        .fc-button-primary { background-color: #2c3e50 !important; border-color: #2c3e50 !important; }
        .fc-button-primary:hover { background-color: #1a252f !important; }
        .fc-button-active { background-color: #18bc9c !important; border-color: #18bc9c !important; }

        /* 放假日(週六、週日) 顯示為紅色 */
        .fc-day-sat, .fc-day-sun { background-color: #fff5f5 !important; }
        .fc-col-header-cell.fc-day-sat a, .fc-col-header-cell.fc-day-sun a { color: #e74c3c !important; }
        .fc-daygrid-day.fc-day-sat .fc-daygrid-day-number, .fc-daygrid-day.fc-day-sun .fc-daygrid-day-number { color: #e74c3c !important; font-weight: bold; }

        /* 自訂彈出視窗 (Modal) 樣式 */
        #modal-overlay {
            display: none;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 9999;
            justify-content: center; align-items: center;
        }
        #custom-modal {
            background: white; padding: 25px; border-radius: 12px; width: 320px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); text-align: center;
        }
        #custom-modal h3 { margin-top: 0; color: #2c3e50; }
        select {
            width: 100%; padding: 10px; font-size: 16px; margin: 15px 0;
            border-radius: 6px; border: 1px solid #ccc;
        }
        .btn-group { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 15px; }
        .btn {
            flex: 1; padding: 8px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; color: white;
        }
        .btn-add { background-color: #3498db; }
        .btn-add:hover { background-color: #2980b9; }
        .btn-del { background-color: #e74c3c; }
        .btn-del:hover { background-color: #c0392b; }
        .btn-save { background-color: #18bc9c; font-size: 16px; padding: 12px; margin-top: 10px; width: 100%; }
        .btn-save:hover { background-color: #128f76; }
        .btn-cancel { background-color: #95a5a6; font-size: 16px; padding: 12px; margin-top: 10px; width: 100%; }
        .btn-cancel:hover { background-color: #7f8c8d; }
    </style>
</head>
<body>

    <div id="app-container">
        <!-- 倒數計時區 -->
        <div id="countdown-container">
            🔥 距離 2027 學測 (1/22) 還有 <span id="countdown-days">--</span> 天！
        </div>

        <!-- 日曆區 -->
        <div id="calendar-container">
            <div id="calendar"></div>
        </div>
    </div>

    <!-- 自訂填表彈出視窗 -->
    <div id="modal-overlay">
        <div id="custom-modal">
            <h3>請選擇計畫項目</h3>
            
            <select id="plan-select"></select>
            
            <div class="btn-group">
                <button class="btn btn-add" onclick="addNewOption()">➕ 新增選項</button>
                <button class="btn btn-del" onclick="deleteCurrentOption()">🗑️ 刪除選項</button>
            </div>
            
            <button class="btn btn-save" onclick="saveEvent()">✔️ 確認加入計畫</button>
            <button class="btn btn-cancel" onclick="closeModal()">❌ 取消</button>
        </div>
    </div>

    <script>
        // --- 1. 學測倒數計時功能 ---
        function updateCountdown() {
            var targetDate = new Date('2027-01-22T00:00:00');
            var now = new Date();
            var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            
            var diffTime = targetDate - today;
            var diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            var countdownEl = document.getElementById('countdown-days');
            if(diffDays > 0) {
                countdownEl.innerText = diffDays;
            } else if(diffDays === 0) {
                countdownEl.innerText = "0";
                document.getElementById('countdown-container').innerText = "🔥 今天就是學測了！祝你考試順利！ 🔥";
            } else {
                document.getElementById('countdown-container').innerText = "學測已經結束囉！辛苦了！";
            }
        }
        updateCountdown();

        // --- 2. 下拉式選單選項管理功能 ---
        var defaultOptions = ['國文複習', '英文模考', '數學A', '數學B', '自然科', '社會科', '寫歷屆試題', '休息放鬆'];
        var planOptions = JSON.parse(localStorage.getItem('myPlanOptions')) || defaultOptions;
        var currentSelectInfo = null; // 暫存使用者選取的日期區間
        var calendar; // 全域日曆變數

        // 渲染下拉式選單
        function renderOptions() {
            var select = document.getElementById('plan-select');
            select.innerHTML = '';
            planOptions.forEach(function(opt) {
                var option = document.createElement('option');
                option.value = opt;
                option.textContent = opt;
                select.appendChild(option);
            });
        }

        // 新增自訂選項
        function addNewOption() {
            var newOpt = prompt('請輸入新的計畫名稱 (例如: 物理第3章)：');
            if (newOpt && newOpt.trim() !== '') {
                newOpt = newOpt.trim();
                if (!planOptions.includes(newOpt)) {
                    planOptions.push(newOpt);
                    localStorage.setItem('myPlanOptions', JSON.stringify(planOptions));
                    renderOptions();
                    document.getElementById('plan-select').value = newOpt; // 自動選中剛新增的選項
                } else {
                    alert('這個選項已經在選單裡囉！');
                }
            }
        }

        // 刪除目前的選項
        function deleteCurrentOption() {
            var select = document.getElementById('plan-select');
            var toDelete = select.value;
            if (toDelete) {
                if (confirm('確定要從選單中刪除「' + toDelete + '」嗎？\n(注意：這不會影響已經記錄在日曆上的計畫)')) {
                    planOptions = planOptions.filter(function(opt) { return opt !== toDelete; });
                    localStorage.setItem('myPlanOptions', JSON.stringify(planOptions));
                    renderOptions();
                }
            }
        }

        // --- 3. 彈出視窗開關控制 ---
        function openModal(info) {
            currentSelectInfo = info;
            renderOptions();
            document.getElementById('modal-overlay').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal-overlay').style.display = 'none';
            if (calendar) calendar.unselect();
            currentSelectInfo = null;
        }

        // 將計畫存入日曆
        function saveEvent() {
            var select = document.getElementById('plan-select');
            var title = select.value;
            if (title && currentSelectInfo) {
                calendar.addEvent({
                    id: String(Date.now()),
                    title: title,
                    start: currentSelectInfo.startStr,
                    end: currentSelectInfo.endStr,
                    allDay: currentSelectInfo.allDay,
                    backgroundColor: '#18bc9c',
                    borderColor: '#18bc9c'
                });
                saveEventsToLocalStorage();
            }
            closeModal();
        }

        // --- 4. 日曆核心初始化 ---
        document.addEventListener('DOMContentLoaded', function() {
            var calendarEl = document.getElementById('calendar');
            var savedEvents = JSON.parse(localStorage.getItem('myCalendarEvents')) || [];

            calendar = new FullCalendar.Calendar(calendarEl, {
                locale: 'zh-tw',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'multiMonthYear,dayGridMonth,timeGridWeek,timeGridDay'
                },
                buttonText: { year: '年', month: '月', week: '周', day: '日', today: '今天' },
                initialView: 'dayGridMonth',
                
                // 限制日曆的顯示範圍 (符合需求：2026只顯示9月之後，2027顯示全年)
                validRange: {
                    start: '2026-09-01',
                    end: '2028-01-01'
                },

                selectable: true,
                selectMirror: true,
                editable: true,
                events: savedEvents,

                // 點擊/拖曳日期時，開啟我們的自訂下拉選單
                select: function(info) {
                    openModal(info);
                },

                // 點擊現有計畫時詢問是否刪除
                eventClick: function(info) {
                    if (confirm('確定要刪除計畫：「' + info.event.title + '」嗎？')) {
                        info.event.remove();
                        saveEventsToLocalStorage();
                    }
                },

                eventDrop: function() { saveEventsToLocalStorage(); },
                eventResize: function() { saveEventsToLocalStorage(); }
            });

            calendar.render();

            function saveEventsToLocalStorage() {
                var currentEvents = calendar.getEvents().map(function(e) {
                    return {
                        id: e.id, title: e.title, start: e.startStr, end: e.endStr, allDay: e.allDay
                    };
                });
                localStorage.setItem('myCalendarEvents', JSON.stringify(currentEvents));
            }
        });
    </script>
</body>
</html>
