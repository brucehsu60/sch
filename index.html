<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學測計畫表</title>
    
    <!-- 引入 FullCalendar 核心與語言包 -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/locales-all.global.min.js"></script>

    <style>
        body {
            margin: 20px 10px;
            padding: 0;
            font-family: 'Helvetica Neue', Helvetica, Arial, '微軟正黑體', sans-serif;
            background-color: #f4f6f8;
            color: #333;
        }
        
        #app-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 動態倒數計時器樣式 */
        #countdown-container {
            background: white; text-align: center; padding: 20px;
            border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px; font-size: 22px; font-weight: bold; color: #2c3e50;
        }
        .cd-num {
            color: #e74c3c; font-size: 32px; margin: 0 4px;
            display: inline-block; min-width: 40px; text-align: center;
        }

        /* 日曆容器樣式 */
        #calendar-container {
            background: white; padding: 20px; border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .fc-button-primary { background-color: #2c3e50 !important; border-color: #2c3e50 !important; }
        .fc-button-primary:hover { background-color: #1a252f !important; }
        .fc-button-active { background-color: #18bc9c !important; border-color: #18bc9c !important; }

        /* 放假日(週六、週日、國定假日) 顯示為紅色 */
        .fc-day-sat, .fc-day-sun, .holiday-red { background-color: #fff5f5 !important; }
        .fc-col-header-cell.fc-day-sat a, .fc-col-header-cell.fc-day-sun a { color: #e74c3c !important; }
        .fc-day-sat .fc-daygrid-day-number, .fc-day-sun .fc-daygrid-day-number, .holiday-red .fc-daygrid-day-number { 
            color: #e74c3c !important; font-weight: bold; 
        }

        /* 組合式彈出視窗 (Modal) 樣式 */
        #modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); z-index: 9999;
            justify-content: center; align-items: center;
        }
        #custom-modal {
            background: white; padding: 25px; border-radius: 12px; width: 380px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        #custom-modal h3 { margin-top: 0; color: #2c3e50; text-align: center; }
        
        .combo-row {
            display: flex; align-items: center; gap: 8px; margin-bottom: 12px;
        }
        .combo-row select {
            flex: 1; padding: 8px; font-size: 16px; border-radius: 6px; border: 1px solid #ccc;
        }
        .mini-btn {
            padding: 6px 10px; font-size: 14px; border: none; border-radius: 4px; cursor: pointer; color: white;
        }
        .btn-add { background-color: #3498db; }
        .btn-del { background-color: #e74c3c; }
        
        #preview-box {
            text-align: center; margin: 15px 0; padding: 10px;
            background: #e8f8f5; color: #16a085; font-weight: bold; font-size: 18px; border-radius: 6px;
        }

        .btn-save { background-color: #18bc9c; font-size: 16px; padding: 12px; width: 100%; border:none; border-radius:6px; color:white; cursor:pointer; }
        .btn-cancel { background-color: #95a5a6; font-size: 16px; padding: 12px; margin-top: 10px; width: 100%; border:none; border-radius:6px; color:white; cursor:pointer; }
    </style>
</head>
<body>

    <div id="app-container">
        <!-- 動態倒數計時區 -->
        <div id="countdown-container">
            🔥 距離 2027 學測 (1/22) 還有 <br>
            <span class="cd-num" id="cd-days">--</span> 天 
            <span class="cd-num" id="cd-hours">--</span> 時 
            <span class="cd-num" id="cd-mins">--</span> 分 
            <span class="cd-num" id="cd-secs">--</span> 秒
        </div>

        <!-- 日曆區 -->
        <div id="calendar-container">
            <div id="calendar"></div>
        </div>
    </div>

    <!-- 組合式填表彈出視窗 -->
    <div id="modal-overlay">
        <div id="custom-modal">
            <h3>📝 組合計畫項目</h3>
            
            <div class="combo-row">
                <span style="width: 40px; font-weight: bold;">類型</span>
                <select id="sel-type" onchange="updatePreview()"></select>
                <button class="mini-btn btn-add" onclick="manageOption('type', 'add')">➕</button>
                <button class="mini-btn btn-del" onclick="manageOption('type', 'del')">🗑️</button>
            </div>
            
            <div class="combo-row">
                <span style="width: 40px; font-weight: bold;">科目</span>
                <select id="sel-subject" onchange="updatePreview()"></select>
                <button class="mini-btn btn-add" onclick="manageOption('subject', 'add')">➕</button>
                <button class="mini-btn btn-del" onclick="manageOption('subject', 'del')">🗑️</button>
            </div>

            <div class="combo-row">
                <span style="width: 40px; font-weight: bold;">形式</span>
                <select id="sel-format" onchange="updatePreview()"></select>
                <button class="mini-btn btn-add" onclick="manageOption('format', 'add')">➕</button>
                <button class="mini-btn btn-del" onclick="manageOption('format', 'del')">🗑️</button>
            </div>
            
            <div id="preview-box">預覽: <span id="plan-preview"></span></div>
            
            <button class="btn-save" onclick="saveEvent()">✔️ 確認加入計畫</button>
            <button class="btn-cancel" onclick="closeModal()">❌ 取消</button>
        </div>
    </div>

    <script>
        // --- 1. 動態學測倒數計時 (每秒更新) ---
        function startCountdown() {
            var targetDate = new Date('2027-01-22T00:00:00').getTime();
            
            setInterval(function() {
                var now = new Date().getTime();
                var distance = targetDate - now;
                
                if (distance < 0) {
                    document.getElementById('countdown-container').innerHTML = "🔥 學測已經開始或結束囉！祝你金榜題名！ 🔥";
                    return;
                }
                
                var days = Math.floor(distance / (1000 * 60 * 60 * 24));
                var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                var seconds = Math.floor((distance % (1000 * 60)) / 1000);
                
                document.getElementById('cd-days').innerText = days;
                document.getElementById('cd-hours').innerText = hours.toString().padStart(2, '0');
                document.getElementById('cd-mins').innerText = minutes.toString().padStart(2, '0');
                document.getElementById('cd-secs').innerText = seconds.toString().padStart(2, '0');
            }, 1000);
        }
        startCountdown();

        // --- 2. 國定假日清單 (2026下半年 ~ 2027全年) ---
        // 包含中秋、國慶、元旦、春節、228、清明、端午等
        var holidays = [
            '2026-09-17', '2026-10-10', // 2026 下半年
            '2027-01-01', // 2027 元旦
            '2027-02-05', '2027-02-06', '2027-02-07', '2027-02-08', '2027-02-09', '2027-02-10', // 2027 春節
            '2027-02-28', '2027-03-01', // 228連假
            '2027-04-04', '2027-04-05', // 兒童清明
            '2027-06-09', // 端午
            '2027-09-15', // 中秋
            '2027-10-10'  // 國慶
        ];

        // --- 3. 組合式下拉選單資料與管理 ---
        var comboData = {
            type: JSON.parse(localStorage.getItem('planTypes')) || ['新', '舊'],
            subject: JSON.parse(localStorage.getItem('planSubjects')) || ['國', '國綜', '國寫', '英', '數', '數A', '數B', '自物', '自化', '自生', '自地', '社會'],
            format: JSON.parse(localStorage.getItem('planFormats')) || ['複習', '模考', '歷屆', '中叢', '筆記']
        };

        function renderSelects() {
            ['type', 'subject', 'format'].forEach(function(category) {
                var select = document.getElementById('sel-' + category);
                var currentValue = select.value; // 記住目前選擇
                select.innerHTML = '';
                comboData[category].forEach(function(opt) {
                    var option = document.createElement('option');
                    option.value = opt; option.textContent = opt;
                    select.appendChild(option);
                });
                if (currentValue && comboData[category].includes(currentValue)) {
                    select.value = currentValue; // 恢復選擇
                }
            });
            updatePreview();
        }

        function updatePreview() {
            var t = document.getElementById('sel-type').value || '';
            var s = document.getElementById('sel-subject').value || '';
            var f = document.getElementById('sel-format').value || '';
            document.getElementById('plan-preview').innerText = t + ' - ' + s + ' - ' + f;
        }

        function manageOption(category, action) {
            var catName = category === 'type' ? '類型' : (category === 'subject' ? '科目' : '形式');
            
            if (action === 'add') {
                var newVal = prompt('請輸入要新增的「' + catName + '」選項：');
                if (newVal && newVal.trim() !== '') {
                    if (!comboData[category].includes(newVal.trim())) {
                        comboData[category].push(newVal.trim());
                    }
                }
            } else if (action === 'del') {
                var toDel = document.getElementById('sel-' + category).value;
                if (toDel && confirm('確定要刪除「' + toDel + '」這個' + catName + '嗎？')) {
                    comboData[category] = comboData[category].filter(function(v) { return v !== toDel; });
                }
            }
            // 存檔並重新渲染
            localStorage.setItem('plan' + category.charAt(0).toUpperCase() + category.slice(1) + 's', JSON.stringify(comboData[category]));
            renderSelects();
        }

        // --- 4. 彈出視窗與日曆互動 ---
        var currentSelectInfo = null;
        var calendar;

        function openModal(info) {
            currentSelectInfo = info;
            renderSelects();
            document.getElementById('modal-overlay').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal-overlay').style.display = 'none';
            if (calendar) calendar.unselect();
            currentSelectInfo = null;
        }

        function saveEvent() {
            var finalTitle = document.getElementById('plan-preview').innerText;
            if (finalTitle && currentSelectInfo) {
                calendar.addEvent({
                    id: String(Date.now()),
                    title: finalTitle,
                    start: currentSelectInfo.startStr,
                    end: currentSelectInfo.endStr,
                    allDay: currentSelectInfo.allDay,
                    backgroundColor: '#18bc9c', borderColor: '#18bc9c'
                });
                saveEventsToLocalStorage();
            }
            closeModal();
        }

        function saveEventsToLocalStorage() {
            var currentEvents = calendar.getEvents().map(function(e) {
                return { id: e.id, title: e.title, start: e.startStr, end: e.endStr, allDay: e.allDay };
            });
            localStorage.setItem('myCalendarEvents', JSON.stringify(currentEvents));
        }

        // --- 5. 日曆初始化 ---
        document.addEventListener('DOMContentLoaded', function() {
            var calendarEl = document.getElementById('calendar');
            var savedEvents = JSON.parse(localStorage.getItem('myCalendarEvents')) || [];

            calendar = new FullCalendar.Calendar(calendarEl, {
                locale: 'zh-tw',
                headerToolbar: {
                    left: 'prev,next today',
                    center: 'title',
                    right: 'multiMonthYear,dayGridMonth,timeGridWeek,timeGridDay'
                },
                buttonText: { year: '年', month: '月', week: '周', day: '日', today: '今天' },
                initialView: 'dayGridMonth',
                
                // 僅限制開始時間，不限制結束時間，這樣就能順利切換到 2027 年
                validRange: { start: '2026-09-01' },

                // 將特定的國定假日加上紅色背景 class
                dayCellClassNames: function(arg) {
                    var dateStr = arg.date.getFullYear() + '-' + 
                                  String(arg.date.getMonth() + 1).padStart(2, '0') + '-' + 
                                  String(arg.date.getDate()).padStart(2, '0');
                    if (holidays.includes(dateStr)) {
                        return ['holiday-red'];
                    }
                    return [];
                },

                selectable: true,
                selectMirror: true,
                editable: true,
                events: savedEvents,

                select: function(info) { openModal(info); },
                
                eventClick: function(info) {
                    if (confirm('確定要刪除計畫：「' + info.event.title + '」嗎？')) {
                        info.event.remove();
                        saveEventsToLocalStorage();
                    }
                },
                eventDrop: function() { saveEventsToLocalStorage(); },
                eventResize: function() { saveEventsToLocalStorage(); }
            });

            calendar.render();
        });
    </script>
</body>
</html>
